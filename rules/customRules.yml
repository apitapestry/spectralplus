  paths-verb: # todo: needs research
    description: Titles must have the right verbs
    given: $.paths[*][*]
    severity: error
    recommended: true
    message: "{{error}}"
    then:
      function: ensureCorrectVerbsInTitles

  schema-type:
    description: Schemas must have a type
    given: $..schema
    severity: error
    recommended: true
    message: "{{error}}"
    then:
      function: ensureSchemaHasType
